<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reconciliation System Test</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .reconcile-status-never {
            @apply bg-red-50 border-red-200 text-red-600;
        }

        .reconcile-status-recent {
            @apply bg-green-50 border-green-200 text-green-600;
        }

        .reconcile-status-warning {
            @apply bg-yellow-50 border-yellow-200 text-yellow-600;
        }

        .reconcile-status-overdue {
            @apply bg-orange-50 border-orange-200 text-orange-600;
        }

        .reconcile-status-critical {
            @apply bg-red-50 border-red-200 text-red-600;
        }
    </style>
</head>

<body class="bg-gray-100 p-8">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // Mock data
        const mockAccounts = [
            {
                id: 'acc-1',
                name: 'Chase Checking',
                type: 'checking',
                startingBalance: 1000,
                startingBalanceDate: '2025-01-01',
                lastReconciledDate: '2025-01-03',
                lastReconciledBalance: 1200,
                institution: 'Chase Bank',
                accountNumber: '****1234',
                isActive: true
            },
            {
                id: 'acc-2',
                name: 'Savings Account',
                type: 'savings',
                startingBalance: 5000,
                startingBalanceDate: '2025-01-01',
                lastReconciledDate: null,
                lastReconciledBalance: 0,
                institution: 'Bank of America',
                accountNumber: '****5678',
                isActive: true
            }
        ];

        const mockTransactions = [
            {
                id: 'txn-1',
                accountId: 'acc-1',
                amount: 500,
                description: 'Salary Deposit',
                date: '2025-01-02',
                isCleared: true
            },
            {
                id: 'txn-2',
                accountId: 'acc-1',
                amount: -50,
                description: 'Grocery Store',
                date: '2025-01-03',
                isCleared: true
            },
            {
                id: 'txn-3',
                accountId: 'acc-1',
                amount: -25,
                description: 'Gas Station',
                date: '2025-01-04',
                isCleared: false
            },
            {
                id: 'txn-4',
                accountId: 'acc-1',
                amount: -100,
                description: 'ATM Withdrawal',
                date: '2025-01-05',
                isCleared: false
            }
        ];

        // Helper functions
        const formatCurrency = (amount) => {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD'
            }).format(amount);
        };

        const calculateAccountBalances = (account, transactions) => {
            if (!account) return { workingBalance: 0, clearedBalance: 0, pendingBalance: 0 };

            const accountTransactions = transactions.filter(t => t.accountId === account.id);
            const startingBalance = account.startingBalance || 0;

            const workingBalance = startingBalance + accountTransactions.reduce((sum, t) => sum + (t.amount || 0), 0);
            const clearedBalance = startingBalance + accountTransactions
                .filter(t => t.isCleared)
                .reduce((sum, t) => sum + (t.amount || 0), 0);
            const pendingBalance = workingBalance - clearedBalance;

            return { workingBalance, clearedBalance, pendingBalance };
        };

        const getReconciliationStatus = (account) => {
            if (!account.lastReconciledDate) {
                return {
                    status: 'never',
                    message: 'Never reconciled',
                    color: 'text-red-600',
                    bgColor: 'bg-red-50',
                    borderColor: 'border-red-200'
                };
            }

            const lastReconciled = new Date(account.lastReconciledDate);
            const now = new Date();
            const daysDiff = Math.floor((now - lastReconciled) / (1000 * 60 * 60 * 24));

            if (daysDiff <= 3) {
                return {
                    status: 'recent',
                    message: `${daysDiff === 0 ? 'Today' : `${daysDiff} day${daysDiff === 1 ? '' : 's'} ago`}`,
                    color: 'text-green-600',
                    bgColor: 'bg-green-50',
                    borderColor: 'border-green-200'
                };
            } else if (daysDiff <= 7) {
                return {
                    status: 'warning',
                    message: `${daysDiff} days ago`,
                    color: 'text-yellow-600',
                    bgColor: 'bg-yellow-50',
                    borderColor: 'border-yellow-200'
                };
            } else if (daysDiff <= 14) {
                return {
                    status: 'overdue',
                    message: `${daysDiff} days ago - Reconcile recommended`,
                    color: 'text-orange-600',
                    bgColor: 'bg-orange-50',
                    borderColor: 'border-orange-200'
                };
            } else {
                return {
                    status: 'critical',
                    message: `${daysDiff} days ago - Reconcile overdue`,
                    color: 'text-red-600',
                    bgColor: 'bg-red-50',
                    borderColor: 'border-red-200'
                };
            }
        };

        // Account Card Component
        const AccountCard = ({ account, transactions }) => {
            const balances = calculateAccountBalances(account, transactions);
            const reconcileStatus = getReconciliationStatus(account);

            return (
                <div className="bg-white rounded-lg shadow-md p-6 mb-4">
                    <div className="flex items-center justify-between mb-4">
                        <div>
                            <h3 className="text-lg font-semibold text-gray-900">{account.name}</h3>
                            <p className="text-sm text-gray-600">{account.institution} • {account.accountNumber}</p>
                        </div>
                        <div className="text-right">
                            <span className="inline-block px-2 py-1 text-xs font-medium bg-blue-100 text-blue-800 rounded">
                                {account.type.charAt(0).toUpperCase() + account.type.slice(1)}
                            </span>
                        </div>
                    </div>

                    {/* Balance Display */}
                    <div className="grid grid-cols-3 gap-4 mb-4">
                        <div className="text-center p-3 bg-gray-50 rounded">
                            <div className="text-sm text-gray-600">Working Balance</div>
                            <div className={`text-lg font-bold ${balances.workingBalance >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                {formatCurrency(balances.workingBalance)}
                            </div>
                        </div>
                        <div className="text-center p-3 bg-green-50 rounded">
                            <div className="text-sm text-green-600">Cleared Balance</div>
                            <div className="text-lg font-bold text-green-700">
                                {formatCurrency(balances.clearedBalance)}
                            </div>
                        </div>
                        <div className="text-center p-3 bg-yellow-50 rounded">
                            <div className="text-sm text-yellow-600">Pending</div>
                            <div className="text-lg font-bold text-yellow-700">
                                {formatCurrency(balances.pendingBalance)}
                            </div>
                        </div>
                    </div>

                    {/* Reconciliation Status */}
                    <div className={`p-3 rounded border ${reconcileStatus.bgColor} ${reconcileStatus.borderColor}`}>
                        <div className="flex items-center justify-between">
                            <span className={`text-sm font-medium ${reconcileStatus.color}`}>
                                Last reconciled: {reconcileStatus.message}
                            </span>
                            <button className="px-3 py-1 bg-blue-600 text-white text-sm rounded hover:bg-blue-700">
                                ⚖️ Reconcile
                            </button>
                        </div>
                    </div>

                    {/* Transaction Summary */}
                    <div className="mt-4 pt-4 border-t border-gray-200">
                        <h4 className="text-sm font-medium text-gray-900 mb-2">Recent Transactions</h4>
                        <div className="space-y-1">
                            {transactions
                                .filter(t => t.accountId === account.id)
                                .slice(0, 3)
                                .map(transaction => (
                                    <div key={transaction.id} className="flex items-center justify-between text-sm">
                                        <div className="flex items-center space-x-2">
                                            <span className={`w-2 h-2 rounded-full ${transaction.isCleared ? 'bg-green-500' : 'bg-yellow-500'}`}></span>
                                            <span className="text-gray-600">{transaction.description}</span>
                                        </div>
                                        <span className={`font-medium ${transaction.amount >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                            {formatCurrency(transaction.amount)}
                                        </span>
                                    </div>
                                ))
                            }
                        </div>
                    </div>
                </div>
            );
        };

        // Main App Component
        const ReconciliationTest = () => {
            const [accounts] = useState(mockAccounts);
            const [transactions] = useState(mockTransactions);

            return (
                <div className="max-w-4xl mx-auto">
                    <div className="mb-8">
                        <h1 className="text-3xl font-bold text-gray-900 mb-2">
                            🏦 YNAB-Style Reconciliation System
                        </h1>
                        <p className="text-gray-600">
                            Testing the new reconciliation system with transaction-driven balances
                        </p>
                    </div>

                    {/* Key Features */}
                    <div className="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6">
                        <h2 className="text-lg font-semibold text-blue-900 mb-2">✅ Key Features Implemented</h2>
                        <ul className="text-sm text-blue-800 space-y-1">
                            <li>• <strong>Transaction-Only Balances:</strong> No manual balance editing after account creation</li>
                            <li>• <strong>Working vs Cleared Balance:</strong> Clear distinction between all transactions and cleared transactions</li>
                            <li>• <strong>Reconciliation Time Indicators:</strong> Visual cues showing how long since last reconciliation</li>
                            <li>• <strong>Starting Balance Lock:</strong> Starting balance and date cannot be changed after creation</li>
                            <li>• <strong>Mobile-Friendly:</strong> Responsive design for reconciliation on the go</li>
                        </ul>
                    </div>

                    {/* Account Cards */}
                    <div className="space-y-6">
                        {accounts.map(account => (
                            <AccountCard
                                key={account.id}
                                account={account}
                                transactions={transactions}
                            />
                        ))}
                    </div>

                    {/* System Benefits */}
                    <div className="mt-8 bg-green-50 border border-green-200 rounded-lg p-4">
                        <h2 className="text-lg font-semibold text-green-900 mb-2">💡 System Benefits</h2>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm text-green-800">
                            <div>
                                <h3 className="font-medium mb-1">Data Integrity</h3>
                                <ul className="space-y-1">
                                    <li>• Single source of truth for balances</li>
                                    <li>• No manual balance corruption possible</li>
                                    <li>• Complete audit trail via transactions</li>
                                </ul>
                            </div>
                            <div>
                                <h3 className="font-medium mb-1">User Clarity</h3>
                                <ul className="space-y-1">
                                    <li>• Always know actual money available</li>
                                    <li>• Clear pending vs cleared distinction</li>
                                    <li>• Reconciliation confidence</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<ReconciliationTest />, document.getElementById('root'));
    </script>
</body>

</html>
