<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Budget Table - Test</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-primary-25 {
            background-color: rgba(59, 130, 246, 0.05);
        }

        .bg-primary-50 {
            background-color: rgba(59, 130, 246, 0.1);
        }

        .bg-gray-25 {
            background-color: rgba(156, 163, 175, 0.05);
        }

        .bg-dark-750 {
            background-color: #1f2937;
        }

        .bg-dark-700 {
            background-color: #374151;
        }

        .bg-dark-600 {
            background-color: #4b5563;
        }

        .bg-dark-800 {
            background-color: #1f2937;
        }

        .text-dark-100 {
            color: #f9fafb;
        }

        .text-dark-200 {
            color: #f3f4f6;
        }

        .text-dark-300 {
            color: #d1d5db;
        }

        .text-dark-400 {
            color: #9ca3af;
        }

        .text-dark-500 {
            color: #6b7280;
        }

        .border-dark-600 {
            border-color: #4b5563;
        }
    </style>
</head>

<body class="bg-gray-50 p-8">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // Mock utility functions
        const formatAmountWithFrequency = (amount, frequency) => {
            const getFrequencyDisplayText = (freq) => {
                switch (freq) {
                    case 'weekly': return 'weekly';
                    case 'bi-weekly': return 'every 2 weeks';
                    case 'every-7-weeks': return 'every 7 weeks';
                    case 'monthly': return 'monthly';
                    case 'quarterly': return 'every 3 months';
                    case 'annually': return 'yearly';
                    default: return freq;
                }
            };

            if (!amount || amount <= 0) return '';
            const formattedAmount = `$${amount.toFixed(2)}`;
            const frequencyText = getFrequencyDisplayText(frequency);
            return `${formattedAmount} ${frequencyText}`;
        };

        const calculateMonthlyAmount = (amount, frequency) => {
            if (!amount || amount <= 0) return 0;
            const occurrencesPerMonth = {
                'weekly': 4.33,
                'bi-weekly': 2.17,
                'every-7-weeks': 0.62,
                'monthly': 1,
                'quarterly': 0.33,
                'annually': 0.08
            };
            return amount * (occurrencesPerMonth[frequency] || 2.17);
        };

        const calculatePaychecksUntilDue = (dueDate, upcomingPaychecks = []) => {
            if (!dueDate || !upcomingPaychecks.length) return 0;

            let dueDateObj;
            if (typeof dueDate === 'string' && dueDate.match(/^\d{4}-\d{2}-\d{2}$/)) {
                const [year, month, day] = dueDate.split('-').map(Number);
                dueDateObj = new Date(year, month - 1, day);
            } else {
                dueDateObj = new Date(dueDate);
            }

            return upcomingPaychecks.filter(paycheck => {
                const paycheckDate = new Date(paycheck.date);
                return paycheckDate <= dueDateObj;
            }).length;
        };

        // Mock data
        const mockData = [
            {
                id: 1,
                name: "Personal Care",
                type: "multiple",
                color: "bg-blue-500",
                monthlyNeed: 185.00,
                perPaycheck: 85.25,
                allocated: 170.00,
                spent: 45.30,
                available: 124.70,
                isActive: true,
                subItems: [
                    {
                        id: 101,
                        name: "Haircuts",
                        amount: 320,
                        frequency: "every-7-weeks",
                        dueDate: "2025-02-15",
                        monthlyNeed: 55.43,
                        perPaycheck: 25.54,
                        allocated: 50.00,
                        spent: 0,
                        available: 50.00
                    },
                    {
                        id: 102,
                        name: "Skincare Products",
                        amount: 60,
                        frequency: "monthly",
                        dueDate: "2025-01-10",
                        monthlyNeed: 60.00,
                        perPaycheck: 27.69,
                        allocated: 60.00,
                        spent: 45.30,
                        available: 14.70
                    },
                    {
                        id: 103,
                        name: "Vitamins",
                        amount: 150,
                        frequency: "quarterly",
                        dueDate: "2025-03-01",
                        monthlyNeed: 49.50,
                        perPaycheck: 22.85,
                        allocated: 60.00,
                        spent: 0,
                        available: 60.00
                    },
                    {
                        id: 104,
                        name: "Gym Membership",
                        amount: 45,
                        frequency: "monthly",
                        dueDate: null,
                        monthlyNeed: 45.00,
                        perPaycheck: 20.77,
                        allocated: 45.00,
                        spent: 0,
                        available: 45.00
                    }
                ]
            },
            {
                id: 2,
                name: "Transportation",
                type: "single",
                color: "bg-green-500",
                monthlyNeed: 450.00,
                perPaycheck: 207.69,
                allocated: 450.00,
                spent: 234.56,
                available: 215.44,
                isActive: true,
                subItems: []
            }
        ];

        // Mock upcoming paychecks
        const mockUpcomingPaychecks = [
            { date: new Date('2025-01-10') },
            { date: new Date('2025-01-24') },
            { date: new Date('2025-02-07') },
            { date: new Date('2025-02-21') },
            { date: new Date('2025-03-07') }
        ];

        // Enhanced Budget Table Demo
        const EnhancedBudgetTableDemo = () => {
            const [expanded, setExpanded] = useState({ 0: true });

            const formatCurrency = (amount) => `$${amount.toFixed(2)}`;

            // Transform data to include sub-items as separate rows
            const flattenedData = useMemo(() => {
                const result = [];
                mockData.forEach((category, index) => {
                    result.push({
                        ...category,
                        originalIndex: index,
                        isParent: true,
                        depth: 0,
                    });

                    if (expanded[index] && category.subItems?.length > 0) {
                        category.subItems.forEach((subItem) => {
                            result.push({
                                ...subItem,
                                originalIndex: index,
                                isParent: false,
                                depth: 1,
                                parentCategory: category,
                            });
                        });
                    }
                });
                return result;
            }, [expanded]);

            return (
                <div className="max-w-6xl mx-auto bg-white rounded-lg shadow-lg overflow-hidden">
                    <div className="bg-gray-50 px-6 py-4 border-b">
                        <h2 className="text-2xl font-bold text-gray-900 flex items-center gap-2">
                            💰 Enhanced Budget Categories Table
                        </h2>
                        <p className="text-gray-600 mt-1">Demonstrating enhanced sub-item display with frequency and paycheck countdown</p>
                    </div>

                    <div className="overflow-x-auto">
                        <table className="w-full">
                            <thead className="bg-gray-50 border-b">
                                <tr>
                                    <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-8"></th>
                                    <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Category</th>
                                    <th className="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Per Month</th>
                                    <th className="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Per Paycheck</th>
                                    <th className="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Allocated</th>
                                    <th className="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Available</th>
                                </tr>
                            </thead>
                            <tbody className="bg-white divide-y divide-gray-200">
                                {flattenedData.map((item, index) => {
                                    const isSubItem = !item.isParent;

                                    return (
                                        <tr key={item.id} className={`transition-colors ${isSubItem ? 'bg-gray-25 hover:bg-gray-50' : 'hover:bg-gray-50'}`}>
                                            <td className="px-4 py-2">
                                                {item.isParent && (
                                                    <button
                                                        onClick={() => {
                                                            setExpanded(prev => ({
                                                                ...prev,
                                                                [item.originalIndex]: !prev[item.originalIndex]
                                                            }));
                                                        }}
                                                        className="p-1 hover:bg-gray-100 rounded transition-colors"
                                                    >
                                                        {expanded[item.originalIndex] ? '▼' : '▶'}
                                                    </button>
                                                )}
                                            </td>

                                            <td className="px-4 py-2">
                                                {item.isParent ? (
                                                    <div className="flex items-center gap-3">
                                                        <div className={`w-3 h-3 rounded-full ${item.color} border border-gray-200`}></div>
                                                        <div className="font-medium text-gray-900">{item.name}</div>
                                                        {item.type === 'multiple' && (
                                                            <svg className="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2" strokeWidth="2" />
                                                            </svg>
                                                        )}
                                                    </div>
                                                ) : (
                                                    <div style={{ marginLeft: 36 }} className="border-l-2 border-gray-200 pl-4">
                                                        <div className="font-medium text-gray-700">{item.name}</div>
                                                        <div className="text-sm text-gray-500">
                                                            {formatAmountWithFrequency(item.amount, item.frequency)}
                                                        </div>
                                                    </div>
                                                )}
                                            </td>

                                            <td className="px-4 py-2 text-right">
                                                {isSubItem && item.amount && item.frequency ? (
                                                    <div>
                                                        <div className="font-medium text-gray-600">
                                                            {formatCurrency(calculateMonthlyAmount(item.amount, item.frequency))}
                                                        </div>
                                                        <div className="text-xs text-gray-400">monthly equiv.</div>
                                                    </div>
                                                ) : (
                                                    <div className={`font-medium ${isSubItem ? 'text-gray-600' : 'text-gray-900'}`}>
                                                        {formatCurrency(item.monthlyNeed || 0)}
                                                    </div>
                                                )}
                                            </td>

                                            <td className="px-4 py-2 text-right">
                                                {isSubItem ? (
                                                    item.dueDate ? (
                                                        <div>
                                                            <div className="flex items-center justify-end gap-1 font-medium text-blue-500">
                                                                <span>{formatCurrency(item.perPaycheck || 0)}</span>
                                                                {(() => {
                                                                    const paychecksLeft = calculatePaychecksUntilDue(item.dueDate, mockUpcomingPaychecks);
                                                                    if (paychecksLeft === 0) {
                                                                        return <span className="text-green-500" title="Due now">⚡</span>;
                                                                    } else {
                                                                        return <span className="text-blue-400" title={`${paychecksLeft} paychecks until due`}>🕒</span>;
                                                                    }
                                                                })()}
                                                            </div>
                                                            <div className="text-xs">
                                                                {(() => {
                                                                    const paychecksLeft = calculatePaychecksUntilDue(item.dueDate, mockUpcomingPaychecks);
                                                                    if (paychecksLeft === 0) {
                                                                        return <span className="text-green-500 font-medium">due now</span>;
                                                                    } else if (paychecksLeft > 0) {
                                                                        return <span className="text-blue-400">{paychecksLeft} left</span>;
                                                                    } else {
                                                                        return <span className="text-red-400">overdue</span>;
                                                                    }
                                                                })()}
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <div>
                                                            <div className="flex items-center justify-end gap-1 font-medium text-blue-500">
                                                                <span>{formatCurrency(item.perPaycheck || 0)}</span>
                                                                <span className="text-gray-400" title="Ongoing expense">♾️</span>
                                                            </div>
                                                            <div className="text-xs text-gray-400">ongoing</div>
                                                        </div>
                                                    )
                                                ) : (
                                                    <div className="font-medium text-blue-600">
                                                        {formatCurrency(item.perPaycheck || 0)}
                                                    </div>
                                                )}
                                            </td>

                                            <td className="px-4 py-2 text-right">
                                                <div className={`font-medium ${isSubItem ? 'text-green-500' : 'text-green-600'}`}>
                                                    {formatCurrency(item.allocated || 0)}
                                                </div>
                                            </td>

                                            <td className="px-4 py-2 text-right">
                                                <div className={`font-bold ${(item.available || 0) < 0
                                                    ? (isSubItem ? 'text-red-500' : 'text-red-600')
                                                    : (isSubItem ? 'text-green-500' : 'text-green-600')
                                                    }`}>
                                                    {formatCurrency(item.available || 0)}
                                                </div>
                                            </td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>

                    <div className="bg-gray-50 border-t px-4 py-3">
                        <div className="text-sm text-gray-600">
                            <strong>Enhanced Features Demonstrated:</strong>
                            <ul className="mt-2 space-y-1 text-xs">
                                <li>• <strong>Sub-item frequency display:</strong> Shows "Amount + user-friendly frequency" (e.g., "$320.00 every 7 weeks")</li>
                                <li>• <strong>Monthly equivalent calculation:</strong> Converts frequency-based amounts to monthly equivalents</li>
                                <li>• <strong>Paycheck countdown:</strong> Shows remaining paychecks until due date (e.g., "3 left")</li>
                                <li>• <strong>Enhanced visual hierarchy:</strong> Sub-items are indented and styled differently from parent categories</li>
                                <li>• <strong>Smart calculations:</strong> Automatically calculates monthly and per-paycheck amounts based on frequency</li>
                            </ul>
                        </div>
                    </div>
                </div>
            );
        };

        // Render the demo
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EnhancedBudgetTableDemo />);
    </script>
</body>

</html>
